[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cligoo"
version = "0.1.0"
description = "Unofficial CLI client for Degoo cloud storage's GraphQL API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Marco Massari Calderone", email = "massaric@gmail.com"},
]
keywords = ["degoo", "cloud", "storage", "backup", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "click>=8.0",
    "keyring>=24.0",
    "humanize>=4.0",
    "pyjwt>=2.0",
    "tomli>=1.2 ; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
cligoo = "cligoo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cligoo*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live API tests requiring valid degoo credentials (deselect with -m 'not integration')",
]
